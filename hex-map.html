<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>STRATAGEM — South Asia Theatre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    height: 44px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #58a6ff; }
  .topbar-right { display: flex; gap: 12px; align-items: center; }
  .badge { font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; color: #8b949e; }
  .badge span { color: #58a6ff; }
  .game-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #mapCanvas {
    flex: 1;
    cursor: crosshair;
  }
  .sidebar {
    width: 200px;
    background: #161b22;
    border-left: 1px solid #30363d;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-section { }
  .sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin-bottom: 6px; }
  .hex-info { background: #21262d; border-radius: 6px; padding: 10px; font-size: 12px; color: #c9d1d9; min-height: 80px; }
  .hex-info .coord { font-size: 11px; color: #58a6ff; font-family: monospace; }
  .hex-info .region { font-size: 13px; font-weight: 600; margin-top: 4px; color: #e6edf3; }
  .hex-info .detail { font-size: 11px; color: #8b949e; margin-top: 4px; }
  .legend { display: flex; flex-direction: column; gap: 5px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #c9d1d9; }
  .legend-color { width: 14px; height: 14px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
  .controls { display: flex; flex-direction: column; gap: 6px; }
  .btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }
  .btn:hover { background: #30363d; color: #e6edf3; }
  .btn.active { background: #1f6feb; border-color: #388bfd; color: #e6edf3; }
  .zoom-controls { display: flex; gap: 4px; }
  .zoom-controls .btn { flex: 1; padding: 5px; }
  .statusbar {
    height: 22px;
    background: #161b22;
    border-top: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 16px;
    font-size: 10px;
    color: #8b949e;
    flex-shrink: 0;
  }
  .statusbar span { color: #58a6ff; }
</style>
</head>
<body>

<div class="topbar">
  <h1>&#9670; STRATAGEM — South Asia Theatre</h1>
  <div class="topbar-right">
    <div class="badge">Turn <span id="turnNum">1</span></div>
    <div class="badge">Hexes <span id="hexCount">—</span></div>
    <div class="badge">Zoom <span id="zoomDisplay">100%</span></div>
  </div>
</div>

<div class="game-area">
  <canvas id="mapCanvas"></canvas>
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Selected Hex</div>
      <div class="hex-info" id="hexInfo">
        <div style="color:#8b949e;font-size:11px">Click any hex to inspect</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Map Mode</div>
      <div class="controls">
        <div class="btn active" id="btnTerrain" onclick="setMode('terrain')">Terrain</div>
        <div class="btn" id="btnPolitical" onclick="setMode('political')">Political</div>
        <div class="btn" id="btnElevation" onclick="setMode('elevation')">Elevation</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Navigation</div>
      <div class="zoom-controls">
        <div class="btn" onclick="zoom(1.25)">+</div>
        <div class="btn" onclick="resetView()">⌂</div>
        <div class="btn" onclick="zoom(0.8)">−</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Legend</div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Regions</div>
      <div id="regionList" style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:#8b949e"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div>Drag to pan &bull; Scroll to zoom &bull; Click hex to select</div>
  <div style="margin-left:auto">Cursor: <span id="cursorCoord">—</span></div>
</div>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

const HEX_SIZE = 22;
const HEX_W = Math.sqrt(3) * HEX_SIZE;
const HEX_H = 2 * HEX_SIZE;

let viewX = 0, viewY = 0, viewScale = 1;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragViewX = 0, dragViewY = 0;
let selectedHex = null;
let currentMode = 'terrain';

const MAP_BOUNDS = { latMin: 5, latMax: 38, lonMin: 60, lonMax: 100 };
const GRID_COLS = 52;
const GRID_ROWS = 44;

function latLonToGrid(lat, lon) {
  return {
    col: (lon - MAP_BOUNDS.lonMin) / (MAP_BOUNDS.lonMax - MAP_BOUNDS.lonMin) * GRID_COLS,
    row: (MAP_BOUNDS.latMax - lat) / (MAP_BOUNDS.latMax - MAP_BOUNDS.latMin) * GRID_ROWS
  };
}

const COUNTRIES = [
  {
    name: 'India',
    color: { terrain: '#2d5a1b', political: '#1a6b3a', elevation: '#3a7a2a' },
    polygons: [
      [latLonToGrid(37,73),latLonToGrid(37,78),latLonToGrid(35,80),latLonToGrid(32,79),latLonToGrid(30,81),latLonToGrid(28,84),latLonToGrid(27,88),latLonToGrid(25,92),latLonToGrid(22,92),latLonToGrid(21,87),latLonToGrid(20,86),latLonToGrid(18,84),latLonToGrid(15,80),latLonToGrid(12,80),latLonToGrid(10,79),latLonToGrid(8,77),latLonToGrid(8,76),latLonToGrid(10,76),latLonToGrid(11,75),latLonToGrid(14,74),latLonToGrid(16,73),latLonToGrid(20,72),latLonToGrid(22,68),latLonToGrid(23,68),latLonToGrid(22,70),latLonToGrid(22,72),latLonToGrid(23,68),latLonToGrid(24,70),latLonToGrid(25,68),latLonToGrid(27,67),latLonToGrid(27,69),latLonToGrid(28,72),latLonToGrid(30,74),latLonToGrid(32,75),latLonToGrid(34,74),latLonToGrid(36,74),latLonToGrid(37,73)]
    ]
  },
  {
    name: 'Pakistan',
    color: { terrain: '#4a7c2a', political: '#2a5fa0', elevation: '#5a8c3a' },
    polygons: [
      [latLonToGrid(37,73),latLonToGrid(36,74),latLonToGrid(34,74),latLonToGrid(32,75),latLonToGrid(30,74),latLonToGrid(28,72),latLonToGrid(27,69),latLonToGrid(27,67),latLonToGrid(25,67),latLonToGrid(24,62),latLonToGrid(25,61),latLonToGrid(26,62),latLonToGrid(28,64),latLonToGrid(30,63),latLonToGrid(31,61),latLonToGrid(33,62),latLonToGrid(35,64),latLonToGrid(36,71),latLonToGrid(37,73)]
    ]
  },
  {
    name: 'Afghanistan',
    color: { terrain: '#6b8c3a', political: '#8b7355', elevation: '#7a9c4a' },
    polygons: [
      [latLonToGrid(38,71),latLonToGrid(38,75),latLonToGrid(37,73),latLonToGrid(36,71),latLonToGrid(35,64),latLonToGrid(33,62),latLonToGrid(31,61),latLonToGrid(30,63),latLonToGrid(29,61),latLonToGrid(30,62),latLonToGrid(31,60),latLonToGrid(33,61),latLonToGrid(34,62),latLonToGrid(35,63),latLonToGrid(36,65),latLonToGrid(36,69),latLonToGrid(37,70),latLonToGrid(38,71)]
    ]
  },
  {
    name: 'Bangladesh',
    color: { terrain: '#1a8a4a', political: '#006a4e', elevation: '#2a9a5a' },
    polygons: [
      [latLonToGrid(25,92),latLonToGrid(26,89),latLonToGrid(25,88),latLonToGrid(24,88),latLonToGrid(22,92),latLonToGrid(22,90),latLonToGrid(21,89),latLonToGrid(22,88),latLonToGrid(24,88),latLonToGrid(25,88),latLonToGrid(26,89),latLonToGrid(25,92)]
    ]
  },
  {
    name: 'Nepal',
    color: { terrain: '#3a6b4a', political: '#dc143c', elevation: '#4a8b5a' },
    polygons: [
      [latLonToGrid(30,81),latLonToGrid(28,84),latLonToGrid(27,88),latLonToGrid(26,89),latLonToGrid(28,81),latLonToGrid(29,82),latLonToGrid(30,81)]
    ]
  },
  {
    name: 'Bhutan',
    color: { terrain: '#2d7a5a', political: '#ff8000', elevation: '#3d8a6a' },
    polygons: [
      [latLonToGrid(28,88),latLonToGrid(27,92),latLonToGrid(26,92),latLonToGrid(27,88),latLonToGrid(28,88)]
    ]
  },
  {
    name: 'Sri Lanka',
    color: { terrain: '#1a9a3a', political: '#8b0000', elevation: '#2aaa4a' },
    polygons: [
      [latLonToGrid(10,80),latLonToGrid(9,80),latLonToGrid(8,81),latLonToGrid(6,81),latLonToGrid(6,80),latLonToGrid(7,80),latLonToGrid(8,80),latLonToGrid(9,81),latLonToGrid(10,80)]
    ]
  },
  {
    name: 'Myanmar',
    color: { terrain: '#2a8a2a', political: '#fecb00', elevation: '#3a9a3a' },
    polygons: [
      [latLonToGrid(28,97),latLonToGrid(25,98),latLonToGrid(22,99),latLonToGrid(20,100),latLonToGrid(16,98),latLonToGrid(14,98),latLonToGrid(10,99),latLonToGrid(12,99),latLonToGrid(16,97),latLonToGrid(17,97),latLonToGrid(19,96),latLonToGrid(22,96),latLonToGrid(23,94),latLonToGrid(25,97),latLonToGrid(27,97),latLonToGrid(28,97)]
    ]
  }
];

const hexes = [];
let hexIndex = 0;

function pointInPolygon(px, py, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i].col, yi = polygon[i].row;
    const xj = polygon[j].col, yj = polygon[j].row;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function getHexCountry(col, row) {
  const gc = col + 0.5;
  const gr = row + 0.5;
  for (const country of COUNTRIES) {
    for (const poly of country.polygons) {
      if (pointInPolygon(gc, gr, poly)) return country;
    }
  }
  return null;
}

for (let r = 0; r < GRID_ROWS; r++) {
  for (let c = 0; c < GRID_COLS; c++) {
    const country = getHexCountry(c, r);
    if (country) {
      hexes.push({ col: c, row: r, country, id: hexIndex++, selected: false });
    }
  }
}

document.getElementById('hexCount').textContent = hexes.length;

function hexToPixel(col, row) {
  const x = HEX_W * (col + (row % 2) * 0.5);
  const y = HEX_H * row * 0.75;
  return { x, y };
}

function pixelToHex(px, py) {
  const row = Math.round(py / (HEX_H * 0.75));
  const col = Math.round((px - (row % 2) * HEX_W * 0.5) / HEX_W);
  return { col, row };
}

function hexVertices(cx, cy) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    pts.push({ x: cx + HEX_SIZE * Math.cos(angle), y: cy + HEX_SIZE * Math.sin(angle) });
  }
  return pts;
}

function drawHex(cx, cy, fillColor, strokeColor) {
  const pts = hexVertices(cx, cy);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 0.8 / viewScale;
  ctx.stroke();
}

function adjustBrightness(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const adj = (v) => Math.min(255, Math.max(0, Math.round(v + v * factor)));
  return `rgb(${adj(r)},${adj(g)},${adj(b)})`;
}

const hexMap = {};
hexes.forEach(h => { hexMap[`${h.col},${h.row}`] = h; });

function render() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  ctx.save();
  ctx.scale(viewScale, viewScale);
  ctx.translate(viewX, viewY);

  ctx.fillStyle = '#050d1a';
  ctx.fillRect(-viewX - 10, -viewY - 10, canvas.width / viewScale + 20, canvas.height / viewScale + 20);

  const visLeft = -viewX - HEX_W * 2;
  const visTop = -viewY - HEX_H * 2;
  const visRight = -viewX + canvas.width / viewScale + HEX_W * 2;
  const visBottom = -viewY + canvas.height / viewScale + HEX_H * 2;

  for (const hex of hexes) {
    const { x, y } = hexToPixel(hex.col, hex.row);
    if (x < visLeft || x > visRight || y < visTop || y > visBottom) continue;

    const variation = ((hex.col * 7 + hex.row * 13) % 5) * 0.04;
    let fill = adjustBrightness(hex.country.color[currentMode], variation);
    let stroke = '#1a3a1a';

    if (hex === selectedHex) {
      fill = '#58a6ff';
      stroke = '#79c0ff';
    }

    drawHex(x, y, fill, stroke);

    if (hex === selectedHex) {
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.max(6, 7 / viewScale)}px monospace`;
      ctx.fillText(`${hex.col},${hex.row}`, x - 8, y + 3);
    }
  }

  if (viewScale > 0.5) drawCountryLabels();

  ctx.restore();
}

function drawCountryLabels() {
  const centroids = {};
  for (const hex of hexes) {
    if (!centroids[hex.country.name]) centroids[hex.country.name] = { x: 0, y: 0, count: 0 };
    const { x, y } = hexToPixel(hex.col, hex.row);
    centroids[hex.country.name].x += x;
    centroids[hex.country.name].y += y;
    centroids[hex.country.name].count++;
  }

  ctx.font = `bold ${Math.max(9, 11 / viewScale)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [name, c] of Object.entries(centroids)) {
    const cx = c.x / c.count;
    const cy = c.y / c.count;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 3 / viewScale;
    ctx.strokeText(name.toUpperCase(), cx, cy);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(name.toUpperCase(), cx, cy);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragViewX = viewX;
  dragViewY = viewY;
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    viewX = dragViewX + (e.clientX - dragStartX) / viewScale;
    viewY = dragViewY + (e.clientY - dragStartY) / viewScale;
    requestAnimationFrame(render);
  }
  const rect = canvas.getBoundingClientRect();
  const wx = (e.clientX - rect.left) / viewScale - viewX;
  const wy = (e.clientY - rect.top) / viewScale - viewY;
  const { col, row } = pixelToHex(wx, wy);
  document.getElementById('cursorCoord').textContent = `${col},${row}`;
});

canvas.addEventListener('mouseup', (e) => {
  const moved = Math.abs(e.clientX - dragStartX) + Math.abs(e.clientY - dragStartY);
  isDragging = false;
  if (moved < 4) {
    const rect = canvas.getBoundingClientRect();
    const wx = (e.clientX - rect.left) / viewScale - viewX;
    const wy = (e.clientY - rect.top) / viewScale - viewY;
    const { col, row } = pixelToHex(wx, wy);
    const hex = hexMap[`${col},${row}`];
    if (hex) {
      selectedHex = hex;
      updateHexInfo(hex);
    } else {
      selectedHex = null;
      document.getElementById('hexInfo').innerHTML = '<div style="color:#8b949e;font-size:11px">Click any hex to inspect</div>';
    }
    requestAnimationFrame(render);
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / viewScale - viewX;
  const my = (e.clientY - rect.top) / viewScale - viewY;
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  viewScale = Math.max(0.3, Math.min(4, viewScale * factor));
  viewX = (e.clientX - rect.left) / viewScale - mx;
  viewY = (e.clientY - rect.top) / viewScale - my;
  document.getElementById('zoomDisplay').textContent = Math.round(viewScale * 100) + '%';
  requestAnimationFrame(render);
}, { passive: false });

function updateHexInfo(hex) {
  const terrainTypes = ['Plains', 'Forest', 'Hills', 'River', 'Coast', 'Jungle', 'Desert', 'Mountains'];
  const terrain = terrainTypes[(hex.col * 3 + hex.row * 7) % terrainTypes.length];
  document.getElementById('hexInfo').innerHTML = `
    <div class="coord">Q:${hex.col} R:${hex.row}</div>
    <div class="region">${hex.country.name}</div>
    <div class="detail">Terrain: ${terrain}</div>
    <div class="detail">Hex ID: #${hex.id}</div>
  `;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  updateLegend();
  requestAnimationFrame(render);
}

function zoom(factor) {
  viewScale = Math.max(0.3, Math.min(4, viewScale * factor));
  document.getElementById('zoomDisplay').textContent = Math.round(viewScale * 100) + '%';
  requestAnimationFrame(render);
}

function resetView() {
  initView();
  document.getElementById('zoomDisplay').textContent = Math.round(viewScale * 100) + '%';
  requestAnimationFrame(render);
}

function initView() {
  if (hexes.length === 0) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const h of hexes) {
    const { x, y } = hexToPixel(h.col, h.row);
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const cw = canvas.offsetWidth || window.innerWidth - 200;
  const ch = canvas.offsetHeight || window.innerHeight - 66;
  const mapW = maxX - minX + HEX_W;
  const mapH = maxY - minY + HEX_H;
  viewScale = Math.min(cw / mapW * 0.88, ch / mapH * 0.88);
  viewX = (cw / viewScale - mapW) / 2 - minX;
  viewY = (ch / viewScale - mapH) / 2 - minY;
}

function updateLegend() {
  const colors = {
    terrain: [['India','#2d5a1b'],['Pakistan','#4a7c2a'],['Afghanistan','#6b8c3a'],['Bangladesh','#1a8a4a'],['Nepal','#3a6b4a'],['Others','#2a8a2a'],['Ocean','#050d1a']],
    political: [['India','#1a6b3a'],['Pakistan','#2a5fa0'],['Nepal','#dc143c'],['Bangladesh','#006a4e'],['Afghanistan','#8b7355'],['Myanmar','#fecb00'],['Ocean','#050d1a']],
    elevation: [['Lowlands','#2a9a5a'],['Midlands','#4a8b5a'],['Highlands','#5a8c3a'],['Mountains','#7a9c4a'],['Ocean','#050d1a']]
  };
  const items = colors[currentMode] || colors.terrain;
  document.getElementById('legend').innerHTML = items.map(([name, color]) =>
    `<div class="legend-item"><div class="legend-color" style="background:${color}"></div>${name}</div>`
  ).join('');
}

function updateRegionList() {
  const counts = {};
  for (const h of hexes) {
    counts[h.country.name] = (counts[h.country.name] || 0) + 1;
  }
  document.getElementById('regionList').innerHTML = Object.entries(counts).map(([name, count]) =>
    `<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #21262d">
      <span>${name}</span><span style="color:#58a6ff">${count}</span>
    </div>`
  ).join('');
}

window.setMode = setMode;
window.zoom = zoom;
window.resetView = resetView;

window.addEventListener('load', () => {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  initView();
  updateLegend();
  updateRegionList();
  render();
});

window.addEventListener('resize', () => {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  render();
});
</script>
</body>
</html>
